# AWS Amplify Hosting build spec — static Astro site.
# Amplify picks this file up automatically from the repository root.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Astro 7 requires Node >= 22.12
        - nvm install 22 && nvm use 22
        - node --version
        - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    build:
      commands:
        - npm run test
        # astro build + scripts/verify-dist.mjs quality gate
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - .cache/**/*
